<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>所有人开始捧腹大笑</title>
<style>
  :root { --bg: #B8832F; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; }

  .center-wrap {
    position: fixed; left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    z-index: 20; text-align: center;
    pointer-events: none;
  }
  .center-text {
    display: inline-block;
    margin: 0; padding: 0;
    border: 0; background: none;
    -webkit-appearance: none; appearance: none;
    font-family: inherit;
    color: #FFFFFF; font-weight: 800;
    font-size: clamp(26px, 7.8vw, 62px);
    line-height: 1.15;
    letter-spacing: 0.04em; white-space: nowrap;
    text-shadow:
      0 2px 0 #7A4B12,
      0 4px 0 rgba(96, 54, 12, 0.55),
      0 8px 20px rgba(70, 38, 6, 0.5);
    animation: breathe 2.8s ease-in-out infinite;
    pointer-events: auto;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  .center-text:active { opacity: 0.86; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.045); }
  }

  .subject {
    position: absolute; top: 0; left: 0;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform;
  }
  .subject.extra { animation-iteration-count: 1; }

    right: 16px;
    bottom: 18px;
    right: calc(16px + env(safe-area-inset-right));
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 30;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255, 246, 220, 0.55);

    color: #FFF6DC;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 14px rgba(70, 38, 6, 0.28);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .music-toggle:active { transform: scale(0.92); }
  .music-toggle.playing {
    background: rgba(255, 246, 220, 0.92);
    color: #7A4B12;
  }

  <button id="music-toggle" class="music-toggle" type="button" aria-label="播放音乐">♪</button>
  <script>
    (function () {
      var stage = document.getElementById('stage');
      var COUNT = 8;
      var ASPECT = 419 / 480;
      function rand(a, b) { return a + Math.random() * (b - a); }
      var MAX_EXTRA = 30;
      function createSubject(isExtra) {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var h = Math.min(300, Math.max(110, vh * rand(0.18, 0.30)));
        var w = h * ASPECT;

        var outer = document.createElement('div');
        outer.className = isExtra ? 'subject extra' : 'subject';
        outer.style.width = w + 'px';
        outer.style.height = h + 'px';
        outer.style.left = rand(0, Math.max(0, vw - w)) + 'px';
        var fallDur = rand(9, 18);
        outer.style.animationDuration = fallDur + 's';

        if (isExtra) {
          outer.style.animationDelay = (-fallDur * 0.37) + 's';
          outer.addEventListener('animationend', function (e) {
            if (e.target === outer && outer.parentNode) {
              outer.parentNode.removeChild(outer);
            }
          });
        } else {
          outer.style.animationDelay = (-rand(0, fallDur)) + 's';
        }

        var inner = document.createElement('div');
        inner.className = 'subject-inner';
        var spinDur = rand(5, 12);
        inner.style.animationDuration = spinDur + 's';
        inner.style.animationDelay = (-rand(0, spinDur)) + 's';
        if (Math.random() < 0.5) { inner.style.animationDirection = 'reverse'; }

        outer.appendChild(inner);
        return outer;
      }
      function build() {
        stage.innerHTML = '';
        var frag = document.createDocumentFragment();
        for (var i = 0; i < COUNT; i++) {
          frag.appendChild(createSubject(false));
        }
        stage.appendChild(frag);
      }
      function addSubject() {
        var extras = stage.querySelectorAll('.subject.extra');
        if (extras.length >= MAX_EXTRA && extras[0].parentNode) {
          extras[0].parentNode.removeChild(extras[0]);
        }
        stage.appendChild(createSubject(true));
      }
      build();
      document.getElementById('drop-btn').addEventListener('click', addSubject);
      var t;
      window.addEventListener('resize', function () {
        clearTimeout(t);
        t = setTimeout(build, 160);
      });

      var bgm = document.getElementById('bgm');
      var musicBtn = document.getElementById('music-toggle');
      bgm.loop = true;
      function syncMusicButton() {
        var playing = !bgm.paused;
        musicBtn.textContent = playing ? '♫' : '♪';
        musicBtn.classList.toggle('playing', playing);
        musicBtn.setAttribute('aria-label', playing ? '暂停音乐' : '播放音乐');
      }
      function tryPlay() {
        if (!bgm.paused) return;
        var p = bgm.play();
        if (p && p.then) {
          p.then(syncMusicButton).catch(function () { syncMusicButton(); });
        } else {
          syncMusicButton();
        }
      }
      function unlockMusic() {
        if (bgm.paused) tryPlay();
        document.removeEventListener('touchstart', unlockMusic);
        document.removeEventListener('click', unlockMusic);
      }
      musicBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (bgm.paused) tryPlay(); else bgm.pause();
      });
      bgm.addEventListener('play', syncMusicButton);
      bgm.addEventListener('pause', syncMusicButton);
      document.addEventListener('touchstart', unlockMusic, { passive: true });
      document.addEventListener('click', unlockMusic);
      document.addEventListener('WeixinJSBridgeReady', tryPlay, false);
      window.addEventListener('load', tryPlay);
      syncMusicButton();
    })();
  </script>
</body>
